[project]
name = "cinefusion-x"
version = "0.1.0"
description = "A multimodel movie recommendation and analysis system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "dvc>=3.67.1",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "mp-api>=0.46.4",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "reflex>=0.9.8.post1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.16.1",
]

# DEVELOPMENT TOOLS

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

# RUFF

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    ".venv",
    "__pycache__",
    ".states",
    "data",
    "artifacts",
    "uploaded_files",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # import sorting
    "B", # flake8-bugbear
    "UP",# pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MYPY

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

exclude = [
    "^data/",
    "^artifacts/",
    "^uploaded_files/",
    "^notebooks/",
    "^\\.venv/",
]

# PYTEST

[too.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
